name = "reqwatch"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Placeholder binding: replace database_id with your own D1 database id (do not commit it).
[[d1_databases]]
binding = "DB"
database_name = "reqwatch"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

# Placeholder queue names: create these with `wrangler queues create` and adjust as needed.
[[queues.producers]]
binding = "FETCH_QUEUE"
queue = "reqwatch-fetch"

[[queues.consumers]]
queue = "reqwatch-fetch"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "reqwatch-fetch-dlq"

# Optional: raw feed snapshots (skipped when the binding is absent). Placeholder bucket name.
# [[r2_buckets]]
# binding = "SNAPSHOTS"
# bucket_name = "reqwatch-snapshots"

# Static landing page. Everything not listed in run_worker_first is served from ./public;
# listed paths always run the Worker. Add new Worker routes here.
[assets]
directory = "./public"
run_worker_first = ["/api/*", "/mcp", "/health", "/admin/*", "/.well-known/*", "/register", "/authorize", "/token", "/revoke", "/oauth/*"]
